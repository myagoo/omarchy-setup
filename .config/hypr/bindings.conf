# Application bindings
$terminal = uwsm-app -- xdg-terminal-exec
$browser = omarchy-launch-browser

bindd = SUPER, RETURN, Terminal, exec, $terminal --working-directory="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER SHIFT, B, Browser, exec, $browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, $browser --private
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, T, Activity, exec, $terminal -e btop
bindd = SUPER SHIFT, D, Docker, exec, $terminal -e lazydocker

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT, G, GitHub, exec, omarchy-launch-webapp "https://github.com/"

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

# Custom VIM like navigation
unbind = SUPER, J, Toggle window split, togglesplit, # dwindle
bindd = SUPER, Y, Toggle window split, togglesplit, # dwindle
unbind = SUPER, K, Show key bindings, exec, omarchy-menu-keybindings
bindd = SUPER, I, Show key bindings, exec, omarchy-menu-keybindings

# bindd = SUPER, LEFT, Move window focus left, movefocus, l
bindd = SUPER, H, Move window focus left, movefocus, l
# bindd = SUPER, RIGHT, Move window focus right, movefocus, r
bindd = SUPER, L, Move window focus right, movefocus, r
# bindd = SUPER, UP, Move window focus up, movefocus, u
bindd = SUPER, K, Move window focus up, movefocus, u
# bindd = SUPER, DOWN, Move window focus down, movefocus, d
bindd = SUPER, J, Move window focus down, movefocus, d

bindd = SUPER SHIFT ALT, H, Move window to previous workspace, movetoworkspace, -1
bindd = SUPER SHIFT ALT, LEFT, Move window to previous workspace, movetoworkspace, -1
bindd = SUPER  ALT, H, Move to the previous workspace, workspace, -1
bindd = SUPER  ALT, LEFT, Move to the previous workspace, workspace, -1
bindd = SUPER SHIFT ALT, L, Move window to next workspace, movetoworkspace, +1
bindd = SUPER SHIFT ALT, RIGHT, Move window to next workspace, movetoworkspace, +1
bindd = SUPER ALT, L, Move to the next workspace, workspace, +1
bindd = SUPER ALT, RIGHT, Move to the next workspace, workspace, +1

# bindd = SUPER SHIFT, LEFT, Swap window to the left, swapwindow, l
# bindd = SUPER SHIFT, RIGHT, Swap window to the right, swapwindow, r
# bindd = SUPER SHIFT, UP, Swap window up, swapwindow, u
# bindd = SUPER SHIFT, DOWN, Swap window down, swapwindow, d

bindd = SUPER SHIFT, H, Swap window to the left, swapwindow, l
bindd = SUPER SHIFT, L, Swap window to the right, swapwindow, r
bindd = SUPER SHIFT, K, Swap window up, swapwindow, u
bindd = SUPER SHIFT, J, Swap window down, swapwindow, d

bind = SUPER, A, submap, fastedit
submap = fastedit
binde = CTRL, right, resizeactive, 10 0
binde = CTRL, left, resizeactive, -10 0
binde = CTRL, up, resizeactive, 0 -10
binde = CTRL, down, resizeactive, 0 10
bind = , left, movefocus, l
bind = , right, movefocus, r
bind = , up, movefocus, u
bind = , down, movefocus, d
bind = SHIFT, left, movewindow, l
bind = SHIFT, right, movewindow, r
bind = SHIFT, up, movewindow, u
bind = SHIFT, down, movewindow, d
bind = , escape, submap, reset
submap = reset
